{% extends "base.html" %}

{% block content %}
<div class="page-stack">

  <div class="tabs" role="tablist" id="listTabs">
    <button class="tab active" data-tab="blacklist" role="tab" aria-selected="true">Blacklist</button>
    <button class="tab" data-tab="whitelist" role="tab" aria-selected="false">Whitelist</button>
  </div>

  <section class="card" id="listPanel">
    <div class="card-head">
      <div class="card-head-title">
        <h3 id="listTitle">Blacklist</h3>
        <p id="listSubtitle">Known-bad domains and IP addresses.</p>
      </div>
      <div class="toolbar">
        <input type="search" id="listSearch" class="input input-search"
               placeholder="Search values…" aria-label="Search list">
        <button class="btn btn-primary" id="listAddBtn">+ Add Entry</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Value</th><th>Type</th><th>Reason</th><th>Created</th>
            <th>Status</th><th class="th-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="listRows">
          <tr><td colspan="6" class="table-empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
{% endblock %}
